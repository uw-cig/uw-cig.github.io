#=======================================================================
# Visitors, shown on /team/ in the "Visitors" table under Alumni,
# newest first. The table is hidden while this list is empty.
# Validated by src/content.config.ts; the build fails with an error
# naming the visitor if a rule is broken.
#
# Fields:
#   name:         full name                                   [mandatory]
#   type:         phd | student | intern                      [mandatory]
#                 shown as Visiting PhD Student / Visiting Student / Intern
#   affiliation:  home institution, e.g. UCLouvain             [mandatory]
#   country:      e.g. Belgium; shown as "UCLouvain, Belgium"  [optional]
#   start:        4-digit year, e.g. 2023                     [mandatory]
#   end:          4-digit year, not before start; omit for a
#                 single-year visit                           [optional]
#   website:      URL; the name links to it                   [optional]
#
# Example:
#   - name: Jane Doe
#     type: phd
#     affiliation: UCLouvain
#     country: Belgium
#     start: 2018
#     end: 2020
#=======================================================================

