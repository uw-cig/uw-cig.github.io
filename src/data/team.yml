#=======================================================================
# Team members, shown on /team/. Validated by src/content.config.ts;
# the build fails with an error naming the entry if a rule is broken.
#
# BS and MS student researchers (current and former) are not listed
# here; they live in src/data/students.yml. Their "mentor" field must
# match a name in this file exactly, so renaming someone here means
# updating students.yml too.
#
# Fields:
#   name:         full name                                   [always mandatory]
#   type:         pi | postdoc | phd                          [always mandatory]
#   current:      true for current members; false or omitted for alumni
#   institution:  e.g. UW-Madison, WashU                      [mandatory for current members]
#   photo:        filename in public/images/team/, ideally square
#                 (a gray placeholder is shown if the file is missing)
#                                                             [always mandatory]
#   website:      URL; the name links to it                   [optional]
#   current_role: current members: overrides the default “PhD Student,
#                 Institution” / “Postdoc, Institution” line;
#                 alumni: shown as “Now: …”                   [optional]
#                 Either a single string:
#                   current_role: Research Scientist, Google
#                 or a list, shown one item per line (for alumni,
#                 only the first line gets the “Now:” prefix):
#                   current_role:
#                     - Assistant Professor, Johns Hopkins University
#                     - Visiting Researcher, Google
#   thesis:       thesis title (alumni)                       [optional]
#   year:         year the person left / graduated            [mandatory for alumni]
#   focus:        short research focus                        [optional]
#=======================================================================

