#=======================================================================
# Student research projects, shown as cards under "Student Researchers"
# on /join/. Available projects come first, then by semester. Validated
# by src/content.config.ts; the build fails with an error naming the
# project if a rule is broken.
#
# Fields:
#   title:        project title                               [mandatory]
#   semester:     "Spring|Summer|Fall YYYY", e.g. Fall 2026   [mandatory]
#   mentors:      list of names; each must match a `name` in
#                 src/data/team.yml exactly; linked to their websites
#                                                             [mandatory]
#   description:  one to three sentences                      [mandatory]
#   media:        filename in src/assets/projects/, shown as a square
#                 on the left of the card; without it a plain
#                 placeholder is shown                        [optional]
#                 (`image` is accepted as an older name for this field)
#                 Animations: .mp4 (preferred), .webm or .gif, served
#                 as-is. Videos play muted on a loop while on screen.
#                 Static: .png, .jpg, .webp or .avif, resized and
#                 converted automatically.
#                 Recommended: 600×600 px, a 2–5 s loop, GIFs under
#                 about 2 MB. The build warns about GIFs over 3 MB and
#                 videos over 5 MB.
#   status:       available | reserved | completed            [mandatory]
#                 completed projects are not shown
#   student:      who took the project; linked if they are in
#                 src/data/students.yml with a website        [mandatory if reserved]
#   level:        list of BS and/or MS, shown as tags         [optional]
#
# Each semester: mark taken projects `reserved` with the `student`,
# set finished ones to `completed` (or delete them), and add new ones.
#=======================================================================

