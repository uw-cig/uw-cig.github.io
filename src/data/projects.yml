- title: Generative Models as Priors for Ptychography
  semester: Fall 2026
  mentors:
    - Edward Chandler
    - Ulugbek S. Kamilov
  description: >-
    Ptychography reconstructs high-resolution images from overlapping 
    diffraction measurements, but limited or noisy data can make reconstruction 
    challenging. This project explores generative models as learned priors to 
    guide reconstruction toward images consistent with both the measurements 
    and the structure of the sample. By combining physical models of diffraction 
    with generative modeling and optimization, we aim to improve reconstruction 
    quality and reduce data acquisition requirements.
  status: reserved
  student: Yan Li
  media: generative-ptychography.mp4
  level:
    - MS

- title: Motion Correction in 3D Whole-Body MRI
  semester: Fall 2026
  mentors:
    - Chicago Park
    - Ulugbek S. Kamilov
  description: >-
    Patient motion during 3D whole-body MRI can blur images and obscure anatomical details. In collaboration with the UW School of Medicine, this project develops computational methods to estimate and correct motion during image reconstruction. By combining MRI physics with optimization and generative modeling, we aim to improve image quality and the reliability of whole-body imaging.
  status: reserved
  student: Joshua Wang
  media: mri-motion-correction.mp4
  level:
    - BS

- title: Reconstructing MRI Images with Diffusion Models
  semester: Fall 2026
  mentors:
    - Xiao Shi
    - Ulugbek S. Kamilov
  description: >-
    This project develops MRI reconstruction methods that use diffusion models as learned image priors. By combining generative modeling with MRI physics, we aim to recover high-quality images from undersampled measurements, enabling faster scans. The work is conducted in collaboration with the UW School of Medicine.
  status: reserved
  student: Tyler Seils
  media: mri-diffusion-reconstruction.mp4
  level:
    - BS